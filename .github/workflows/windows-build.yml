name: Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/windows-tray']
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python run_tests.py
      - run: python -m PyInstaller --clean --noconfirm SmartMiBand.spec
      - uses: actions/upload-artifact@v4
        with:
          name: SmartMiBand-Windows
          path: dist/SmartMiBand.exe
          if-no-files-found: error
